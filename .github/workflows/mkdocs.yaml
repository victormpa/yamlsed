name: docs
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install dev dependencies
        run: poetry install --with dev
      - name: Run tests with coverage
        run: |
          printf '# Tests\n\n' > docs/tests.md
          poetry run pytest tests \
            --cov=yamlsed \
            --cov-report=term-missing \
            --cov-report=markdown:/tmp/coverage.md \
            > /tmp/pytest-output.txt 2>&1
          printf '## Test run\n\n```text\n' >> docs/tests.md
          cat /tmp/pytest-output.txt >> docs/tests.md
          printf '\n```\n\n' >> docs/tests.md
          cat /tmp/coverage.md >> docs/tests.md
      - name: Deploy docs
        run: poetry run mkdocs gh-deploy --force --no-history
