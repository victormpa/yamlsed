[project]
name = "yamlsed"
version = "0.1.0"
description = ""
authors = [{ name = "victormpa", email = "victor.martins.dpaula@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pyyaml (>=6.0.3,<7.0.0)"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.pytest.ini_options]
pythonpath = ["."]
