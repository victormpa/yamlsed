site_name: yamlsed
repo_url: https://github.com/victormpa/yamlsed
repo_name: victormpa/yamlsed

theme:
  name: material
  features:
    - navigation.instant   # the "Initializing search" SPA behavior
    - navigation.top
    - search.suggest
    - content.code.copy    # copy button on code blocks

markdown_extensions:
  - pymdownx.highlight      # syntax-highlighted code blocks
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Concepts: concepts.md
  - Matching: matching.md
  - Patching:
    - Overview: patch-operations/index.md
    - Scalars: patch-operations/scalars.md
    - Arrays and objects: patch-operations/collections.md
    - Functions: patch-operations/functions.md
  - Examples: examples.md